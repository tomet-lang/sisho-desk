[workspace]
resolver = "3"
members = [
  "app",
  "crates/sisho-desk-core",
  "crates/sisho-desk-tui",
]

default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sisho-desk-core = { path = "crates/sisho-desk-core" }
sisho-desk-tui = { path = "crates/sisho-desk-tui" }

#= Tomet
tomet-ast = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-config = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-indexer = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-load-config = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-markdown = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-parser = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-printer = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-semantics = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-transform = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-tree = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-workspace = { git = "https://github.com/tomet-lang/tomet.git" }
tree-sitter-tomet = { git = "https://github.com/tomet-lang/tomet.git" }

#= Sisho
sisho-sdk = { git = "https://github.com/tomet-lang/sisho.git" }

#= Crates.io
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
tree-sitter = "0.26"
uuid = { version = "1.23", features = ["v4", "js"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
